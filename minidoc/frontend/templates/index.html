<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniDoc - Your Health Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow">
        <nav class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <a href="#" class="text-2xl font-bold text-gray-800">MiniDoc</a>
                <div>
                    <a href="#" id="login-btn" class="mx-2 text-gray-600 hover:text-gray-800">Login</a>
                    <a href="#" id="register-btn" class="mx-2 text-gray-600 hover:text-gray-800">Register</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Doctor & Surgeon Directory</h1>
        <div class="mb-4">
            <input type="text" id="doctor-search" class="w-full p-2 border rounded" placeholder="Search by specialty, illness, or hospital...">
        </div>
        <div id="doctor-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Doctor profiles will be loaded here -->
        </div>

        <h2 class="text-3xl font-bold text-center text-gray-800 mt-12 mb-8">Hospital Capacity</h2>
        <div id="hospital-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Hospital data will be loaded here -->
        </div>

        <div class="my-12">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">AI Medical Assistant</h2>
            <div class="bg-white p-6 rounded-lg shadow">
                <form id="ai-diagnose-form">
                    <div class="mb-4">
                        <label for="symptoms" class="block text-gray-700">Describe your symptoms:</label>
                        <textarea id="symptoms" class="w-full p-2 border rounded" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Get Diagnosis</button>
                </form>
                <div id="diagnosis-result" class="mt-4"></div>
                <p class="text-sm text-gray-500 mt-4">Disclaimer: AI results are not a replacement for real medical diagnosis.</p>
            </div>
        </div>
    </main>

    <footer class="bg-white shadow mt-8">
        <div class="container mx-auto px-6 py-4 text-center text-gray-600">
            &copy; 2024 MiniDoc. All rights reserved.
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <!-- Booking Modal -->
    <div id="booking-modal" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-lg shadow-lg w-1/3">
            <h2 class="text-2xl font-bold mb-4">Book Appointment</h2>
            <form id="booking-form">
                <input type="hidden" id="doctor-id-input">
                <div class="mb-4">
                    <label for="patient-id" class="block text-gray-700">Patient ID</label>
                    <input type="text" id="patient-id" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label for="date-time" class="block text-gray-700">Date & Time</label>
                    <input type="datetime-local" id="date-time" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label for="reason" class="block text-gray-700">Reason for Visit</label>
                    <textarea id="reason" class="w-full p-2 border rounded" required></textarea>
                </div>
                <div class="mb-4">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="is-urgent" class="form-checkbox">
                        <span class="ml-2">Urgent</span>
                    </label>
                </div>
                <div class="flex justify-end">
                    <button type="button" class="bg-gray-500 text-white px-4 py-2 rounded mr-2" onclick="closeBookingModal()">Cancel</button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Book</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-lg shadow-lg w-1/3">
            <h2 class="text-2xl font-bold mb-4">Login</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label for="login-email" class="block text-gray-700">Email</label>
                    <input type="email" id="login-email" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label for="login-password" class="block text-gray-700">Password</label>
                    <input type="password" id="login-password" class="w-full p-2 border rounded" required>
                </div>
                <div class="flex justify-end">
                    <button type="button" class="bg-gray-500 text-white px-4 py-2 rounded mr-2" onclick="closeLoginModal()">Cancel</button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-lg shadow-lg w-1/3">
            <h2 class="text-2xl font-bold mb-4">Register</h2>
            <form id="register-form">
                <div class="mb-4">
                    <label for="register-name" class="block text-gray-700">Name</label>
                    <input type="text" id="register-name" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label for="register-email" class="block text-gray-700">Email</label>
                    <input type="email" id="register-email" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label for="register-password" class="block text-gray-700">Password</label>
                    <input type="password" id="register-password" class="w-full p-2 border rounded" required>
                </div>
                <div class="flex justify-end">
                    <button type="button" class="bg-gray-500 text-white px-4 py-2 rounded mr-2" onclick="closeRegisterModal()">Cancel</button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Register</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
