<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow">
        <nav class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <a href="/" class="text-2xl font-bold text-gray-800">MiniDoc</a>
                <a href="#" id="logout-btn" class="text-gray-600 hover:text-gray-800">Logout</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Patient Portal</h1>

        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-2xl font-bold mb-4">My Appointments</h2>
            <div id="appointments-list" class="space-y-4">
                <!-- Appointments will be loaded here -->
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-4">My Prescriptions</h2>
            <div id="prescriptions-list" class="space-y-4">
                <!-- Prescriptions will be loaded here -->
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/patient_portal.js') }}"></script>
</body>
</html>
